<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff dashboard — Mirage Productions</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><a class="brand" href="https://miragesmp.org/" aria-label="Mirage Productions home"><span class="brand-mark">M</span><span class="brand-name">MIRAGE <span>PRODUCTIONS</span></span></a><div class="row"><a class="text-link" href="dashboard.html">Player portal</a><button id="signout" class="button" style="padding:8px 12px;background:#202024;color:#f4f4f0;border-color:#3c3c40">Sign out</button></div></header>
